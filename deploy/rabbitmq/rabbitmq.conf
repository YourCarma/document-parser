# Конфигурация RabbitMQ для локальной разработки document-parser.
# Боевой контур настраивается отдельно, здесь только то, без чего сервис
# ведёт себя не так, как в проде.

loopback_users.guest = true
default_user = guest
default_pass = guest

# Максимальное время, которое сообщение может оставаться неподтверждённым.
# Значение в МИЛЛИСЕКУНДАХ. По умолчанию 30 минут, и этого не хватает: перевод
# большого документа идёт дольше, брокер разрывает канал с PRECONDITION_FAILED,
# сообщение возвращается в очередь и обрабатывается по кругу.
# Должно быть заметно больше TASK_TIMEOUT_SECS (сейчас 3000 с).
consumer_timeout = 3600000
